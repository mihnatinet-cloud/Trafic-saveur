<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,sans-serif; }
body { background:#F7F3EA; color:#3B1B12; overflow-x:hidden; }
body.rtl { direction:rtl; text-align:right; }
body.ltr { direction:ltr; text-align:left; }
.header { background:linear-gradient(135deg,#3B1B12,#5a2a1a); color:#FFC52E; 
  padding:15px 25px; display:flex; justify-content:space-between; align-items:center; 
  box-shadow:0 2px 8px rgba(0,0,0,0.2); flex-wrap:wrap; gap:15px; }
.header-left h1 { font-size:24px; }
.header-left .sub { color:#fff; font-size:12px; margin-top:3px; }
.header-right { display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
.clock-container { display:flex; align-items:center; gap:12px; 
  background:rgba(255,255,255,0.1); padding:8px 15px; 
  border-radius:30px; border:1px solid rgba(233,169,0,0.4); }
.clock-time { font-size:20px; font-weight:bold; color:#FFC52E; 
  font-family:'Courier New',monospace; letter-spacing:1px;
  text-shadow:0 0 10px rgba(255,197,46,0.5); }
.clock-date { font-size:11px; color:#fff; margin-top:2px; }
.clock-svg { animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }
.lang-btn { background:linear-gradient(135deg,#E9A900,#d49900); color:#3B1B12; 
  border:2px solid #FFC52E; padding:8px 16px; border-radius:20px;
  font-weight:bold; font-size:13px; cursor:pointer; transition:all 0.3s; 
  display:flex; align-items:center; gap:6px; box-shadow:0 2px 6px rgba(233,169,0,0.3); }
.lang-btn:hover { transform:scale(1.05); box-shadow:0 4px 12px rgba(233,169,0,0.5); }
.nav { background:#E9DFD0; padding:10px 20px; display:flex; gap:8px; flex-wrap:wrap; 
  border-bottom:2px solid #d4c4a8; }
.nav button { background:transparent; border:none; color:#3B1B12; padding:10px 16px; 
  font-size:13px; font-weight:bold; cursor:pointer; border-radius:6px; transition:0.2s; }
.nav button:hover { background:#f5e8cf; }
.nav button.active { background:#E9A900; color:#3B1B12; }
.content { padding:25px; min-height:500px; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); 
  gap:15px; margin-bottom:25px; }
.card { background:#fff; border-radius:10px; padding:18px; border-top:4px solid #E9A900; 
  box-shadow:0 2px 6px rgba(0,0,0,0.06); }
.card.green { border-color:#26734D; }
.card.red { border-color:#B33A32; }
.card.blue { border-color:#2874A6; }
.card .title { color:#776A62; font-size:12px; font-weight:bold; margin-bottom:8px; }
.card .value { color:#3B1B12; font-size:20px; font-weight:bold; }
.section-title { font-size:20px; color:#3B1B12; margin-bottom:15px; 
  border-bottom:2px solid #E9A900; padding-bottom:8px; 
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
.btn { background:#E9A900; color:#3B1B12; border:none; padding:9px 18px; 
  border-radius:6px; font-weight:bold; cursor:pointer; font-size:13px; transition:0.2s; }
.btn:hover { background:#d49900; }
.btn-sm { padding:5px 10px; font-size:12px; }
.btn-danger { background:#B33A32; color:#fff; }
.btn-success { background:#26734D; color:#fff; }
.search-box { margin-bottom:15px; }
.search-box input { width:100%; padding:12px 15px; font-size:14px; border:2px solid #d4c4a8; 
  border-radius:8px; background:#fff; transition:0.2s; }
.search-box input:focus { border-color:#E9A900; outline:none; box-shadow:0 0 0 3px rgba(233,169,0,0.2); }
table { width:100%; background:#fff; border-collapse:collapse; border-radius:8px; 
  overflow:hidden; box-shadow:0 2px 6px rgba(0,0,0,0.06); }
th { background:#EDE3D2; color:#3B1B12; padding:12px; font-size:13px; text-align:center; }
td { padding:10px; text-align:center; border-top:1px solid #f0e6d2; font-size:13px; }
tr:hover { background:#fdf8ec; }
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); 
  z-index:1000; justify-content:center; align-items:center; }
.modal-bg.show { display:flex; }
.modal { background:#F7F3EA; border-radius:10px; padding:25px; width:90%; 
  max-width:650px; max-height:85vh; overflow-y:auto; }
.modal h3 { color:#3B1B12; margin-bottom:18px; border-bottom:2px solid #E9A900; padding-bottom:10px; }
.form-group { margin-bottom:12px; }
.form-group label { display:block; margin-bottom:5px; font-weight:bold; font-size:13px; color:#3B1B12; }
.form-group input, .form-group select, .form-group textarea { 
  width:100%; padding:9px; border:1px solid #d4c4a8; border-radius:5px; 
  font-size:13px; background:#fff; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.items-list { background:#fff; border-radius:6px; padding:10px; margin-top:10px; 
  max-height:200px; overflow-y:auto; }
.item-row { display:flex; justify-content:space-between; padding:6px; 
  border-bottom:1px solid #f0e6d2; font-size:13px; }
.alert { padding:10px; border-radius:6px; margin:10px 0; font-size:13px; }
.alert-success { background:#d4edda; color:#155724; }
.alert-danger { background:#f8d7da; color:#721c24; }
.alert-warning { background:#fff3cd; color:#856404; }
.total-bar { background:#EDE3D2; padding:12px; border-radius:6px; 
  display:flex; justify-content:space-between; align-items:center; 
  margin-top:15px; font-weight:bold; }
.loader { text-align:center; padding:40px; color:#776A62; }
.no-results { text-align:center; padding:30px; color:#776A62; font-style:italic; }
</style>
</head>

        <circle cx="50" cy="50" r="1.5" fill="#FFC52E"/>
      </svg>
      <div>

  </div>
</div>

  const keys = path.split('.');
  let val = translations[currentLang];
  for (const k of keys) {
    if (val && val[k] !== undefined) val = val[k];
    else return path;
  }
  return val;
}

function toggleLang() {
  currentLang = currentLang === 'ar' ? 'fr' : 'ar';
  localStorage.setItem('trafik_lang', currentLang);
  applyLang();
  const activeBtn = document.querySelector('.nav button.active');
  if (activeBtn) activeBtn.click();
}

function applyLang() {
  const isAr = currentLang === 'ar';
  document.body.className = isAr ? 'rtl' : 'ltr';
  document.documentElement.lang = currentLang;
  document.documentElement.dir = isAr ? 'rtl' : 'ltr';
  document.getElementById('langFlag').textContent = isAr ? '🇫🇷' : '🇸🇦';
  document.getElementById('langLabel').textContent = isAr ? 'Français' : 'العربية';
  document.querySelectorAll('[data-t]').forEach(el => {
    const key = el.getAttribute('data-t');
    el.textContent = t(key);
  });
  renderNav();
}

function renderNav() {
  const nav = document.getElementById('navBar');
  const sections = ['dashboard','products','sales','purchases','customers','expenses','reports','backup','settings'];
  nav.innerHTML = sections.map(s => 
    `<button class="${s===currentSection?'active':''}" onclick="showSection('${s}',this)">${t('nav.'+s)}</button>`
  ).join('');
}

function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clockTime').textContent = `${h}:${m}:${s}`;
  const isAr = currentLang === 'ar';
  document.getElementById('clockDate').textContent = now.toLocaleDateString(isAr?'ar-DZ':'fr-FR', {
    weekday:'long', day:'numeric', month:'long', year:'numeric'
  });
  const hours = now.getHours() % 12;
  const minutes = now.getMinutes();
  const seconds = now.getSeconds();
  setHand('hourHand', (hours*30)+(minutes*0.5), 22);
  setHand('minHand', minutes*6, 30);
  setHand('secHand', seconds*6, 33);
}

function setHand(id, angle, length) {
  const rad = (angle - 90) * Math.PI / 180;
  const hand = document.getElementById(id);
  if (hand) {
    hand.setAttribute('x2', 50 + length * Math.cos(rad));
    hand.setAttribute('y2', 50 + length * Math.sin(rad));
  }
}

setInterval(updateClock, 1000);
updateClock();

function showSection(name, btn) {
  currentSection = name;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active'); else renderNav();
  content.innerHTML = `<div class="loader">${t('loading')}</div>`;
  const funcs = {
    dashboard:loadDashboard, products:loadProducts, sales:loadSales,
    purchases:loadPurchases, customers:loadCustomers, expenses:loadExpenses,
    reports:loadReports, backup:loadBackup, settings:loadSettings
  };
  try { funcs[name](); } catch(e) { content.innerHTML = `<div class="alert alert-danger">${t('common.error')}: ${e.message}</div>`; }
}

function openModal(html) { modalContent.innerHTML = html; modalBg.classList.add('show'); }
function closeModal() { modalBg.classList.remove('show'); }
modalBg.onclick = e => { if(e.target===modalBg) closeModal(); };

    .withSuccessHandler(onSuccess)
    .withFailureHandler(e => {
      content.innerHTML = `<div class="alert alert-danger">${t('common.error')}: ${e.message}</div>`;
    })[fn](data);
}

function setSalePrice() {
  const sel = document.getElementById('s_prod');
  document.getElementById('s_price').value = sel.options[sel.selectedIndex].dataset.price;
}

function addSaleItem() {
  const f = t('sales.form');
  const sel = document.getElementById('s_prod');
  const id = sel.value, name = sel.options[sel.selectedIndex].dataset.name;
  const qty = parseFloat(document.getElementById('s_qty').value);
  const price = parseFloat(document.getElementById('s_price').value);
  const stock = parseFloat(sel.options[sel.selectedIndex].dataset.stock);
  if(!qty||qty<=0||!price) { alert(f.emptyQty); return; }
  const existing = saleItems.find(i=>i.productId==id);
  const totalQty = (existing?existing.qty:0) + qty;
  if(totalQty > stock) { alert(f.overStock); return; }
  if(existing) existing.qty = totalQty;
  else saleItems.push({productId:id, name, qty, price});
  renderSaleItems();
}

function renderSaleItems() {
  const f = t('sales.form');
  let total = 0;
  const html = saleItems.map((it,i)=>{
    const sub = it.qty*it.price; total += sub;
    return `<div class="item-row"><span>${it.name} × ${it.qty} = ${sub.toFixed(2)}</span><button class="btn btn-sm btn-danger" onclick="removeSaleItem(${i})">×</button></div>`;
  }).join('');
  document.getElementById('saleItemsList').innerHTML = html || `<div style="padding:10px;color:#776A62;">${f.noItemsYet}</div>`;
  document.getElementById('saleTotal').innerText = total.toFixed(2);
}

function removeSaleItem(i) { saleItems.splice(i,1); renderSaleItems(); }

  const f = t('purchases.form');
  call('getProducts', undefined, prods => {
    openModal(`
      <h3>${f.title}</h3>
      <div class="form-row">
        <div class="form-group"><label>${f.supplier}</label><input id="pu_supp"></div>
        <div class="form-group"><label>${f.date}</label><input id="pu_date" type="date" value="${new Date().toISOString().substring(0,10)}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>${f.product}</label><select id="pu_prod" onchange="setPurchCost()">${prods.map(p=>`<option value="${p.id}" data-cost="${p.rawBuy}" data-name="${p.name}">${p.name}</option>`).join('')}</select></div>
        <div class="form-group"><label>${f.qty}</label><input id="pu_qty" type="number" step="0.01" value="1"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>${f.cost}</label><input id="pu_cost" type="number" step="0.01"></div>
        <div class="form-group"><label>${f.paid}</label><input id="pu_paid" type="number" step="0.01" value="0"></div>
      </div>
      <button class="btn" onclick="addPurchaseItem()">${f.addItem}</button>
      <div class="items-list" id="purchItemsList"></div>
      <div class="total-bar"><span>${t('dashboard.th.total')}:</span><span id="purchTotal">0.00</span></div>
      <div style="display:flex;gap:10px;margin-top:15px;">
        <button class="btn btn-success" onclick="savePurchase()">${f.save}</button>
        <button class="btn" onclick="closeModal()">${f.cancel}</button>
      </div>`);
    setPurchCost();
  });
}

function setPurchCost() {
  const sel = document.getElementById('pu_prod');
  document.getElementById('pu_cost').value = sel.options[sel.selectedIndex].dataset.cost;
}

function addPurchaseItem() {
  const f = t('purchases.form');
  const sel = document.getElementById('pu_prod');
  const id = sel.value, name = sel.options[sel.selectedIndex].dataset.name;
  const qty = parseFloat(document.getElementById('pu_qty').value);
  const cost = parseFloat(document.getElementById('pu_cost').value);
  if(!qty||!cost) { alert(f.invalidData); return; }
  purchaseItems.push({productId:id, name, qty, cost});
  renderPurchItems();
}

function renderPurchItems() {
  let total = 0;
  const html = purchaseItems.map((it,i)=>{
    const sub = it.qty*it.cost; total += sub;
    return `<div class="item-row"><span>${it.name} × ${it.qty} = ${sub.toFixed(2)}</span><button class="btn btn-sm btn-danger" onclick="removePurchItem(${i})">×</button></div>`;
  }).join('');
  document.getElementById('purchItemsList').innerHTML = html;
  document.getElementById('purchTotal').innerText = total.toFixed(2);
}

function removePurchItem(i) { purchaseItems.splice(i,1); renderPurchItems(); }

function savePurchase() {
  const f = t('purchases.form');
  if(!purchaseItems.length) { alert(f.noItems); return; }
  const data = {
    date: document.getElementById('pu_date').value,
    supplier: document.getElementById('pu_supp').value,
    paid: document.getElementById('pu_paid').value,
    items: JSON.stringify(purchaseItems)
  };
  google.script.run
    .withSuccessHandler(r=>{ closeModal(); alert(`${f.success} ${r.id}`); loadPurchases(); })
    .withFailureHandler(e=>alert(e.message))
    .savePurchase(data);
}

// ===== المصاريف مع البحث =====
function loadExpenses() {
  content.innerHTML = `
    <div class="section-title">${t('expenses.title')}<button class="btn" onclick="expenseForm()">${t('expenses.add')}</button></div>
    <div class="search-box">
      <input type="text" id="searchExpense" placeholder="${t('expenses.searchPlaceholder')}" oninput="searchExpensesLive()">
    </div>
    <div id="expensesList"></div>`;
  call('getExpenses', undefined, list => renderExpensesList(list));
}

function searchExpensesLive() {
  const query = document.getElementById('searchExpense').value;
  call('searchExpenses', query, list => renderExpensesList(list));
}

function renderExpensesList(list) {
  const th = t('expenses.th');
  const noResults = list.length === 0 && document.getElementById('searchExpense')?.value ? 
    `<tr><td colspan="6" class="no-results">${t('expenses.noResults')}</td></tr>` : '';
  document.getElementById('expensesList').innerHTML = `
    <table><thead><tr><th>${th.num}</th><th>${th.date}</th><th>${th.desc}</th><th>${th.amount}</th><th>${th.notes}</th><th>${th.actions}</th></tr></thead>
    <tbody>${list.map(e=>`<tr><td>${e.id}</td><td>${e.date}</td><td>${e.title}</td><td>${e.amount}</td><td>${e.notes||'-'}</td><td><button class="btn btn-sm btn-danger" onclick="delExpense(${e.id})">${t('products.delete')}</button></td></tr>`).join('')||noResults||`<tr><td colspan="6">${t('expenses.empty')}</td></tr>`}</tbody></table>`;
}

function expenseForm() {
  const f = t('expenses.form');
  openModal(`
    <h3>${f.title}</h3>
    <div class="form-row">
      <div class="form-group"><label>${f.date}</label><input id="e_date" type="date" value="${new Date().toISOString().substring(0,10)}"></div>
      <div class="form-group"><label>${f.amount}</label><input id="e_amount" type="number" step="0.01"></div>
    </div>
    <div class="form-group"><label>${f.desc} *</label><input id="e_title"></div>
    <div class="form-group"><label>${f.notes}</label><input id="e_notes"></div>
    <button class="btn btn-success" onclick="saveExpense()">${f.save}</button>
    <button class="btn" onclick="closeModal()">${f.cancel}</button>`);
}

function saveExpense() {
  const f = t('expenses.form');
  const data = {date:document.getElementById('e_date').value, title:document.getElementById('e_title').value,
    amount:document.getElementById('e_amount').value, notes:document.getElementById('e_notes').value};
  if(!data.title||!data.amount) { alert(f.required); return; }
  call('saveExpense', data, ()=>{closeModal();loadExpenses();});
}

function delExpense(id) { 
  if(confirm(t('expenses.confirmDelete'))) {
    call('deleteExpense', id, (msg)=>{ alert(msg); loadExpenses(); });
  } 
}

// ===== التقارير =====
function loadReports() {
  const today = new Date();
  const firstDay = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().substring(0,10);
  const todayStr = today.toISOString().substring(0,10);
  content.innerHTML = `
    <div class="section-title">${t('reports.title')}</div>
    <div class="card" style="max-width:800px;margin-bottom:20px;">
      <div class="form-row">
        <div class="form-group"><label>${t('reports.from')}</label><input id="r_start" type="date" value="${firstDay}"></div>
        <div class="form-group"><label>${t('reports.to')}</label><input id="r_end" type="date" value="${todayStr}"></div>
      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn" onclick="showReport()">${t('reports.show')}</button>
        <button class="btn btn-success" onclick="exportReportCSV()">${t('reports.export')}</button>
      </div>
    </div>
    <div id="reportResult"></div>`;
  showReport();
}

function showReport() {
  const start = document.getElementById('r_start').value;
  const end = document.getElementById('r_end').value;
  if(!start||!end) { alert(t('reports.invalidDates')); return; }
  call('getReport', {startDate:start, endDate:end}, r => {
    document.getElementById('reportResult').innerHTML = `
      <div class="cards">
        <div class="card"><div class="title">${t('reports.totalSales')}</div><div class="value">${r.totalSales}</div></div>
        <div class="card green"><div class="title">${t('reports.totalPaid')}</div><div class="value">${r.totalPaid}</div></div>
        <div class="card"><div class="title">${t('reports.totalPurchases')}</div><div class="value">${r.totalPurchases}</div></div>
        <div class="card"><div class="title">${t('reports.totalExpenses')}</div><div class="value">${r.totalExpenses}</div></div>
        <div class="card ${parseFloat(r.profit.replace(/[^\d.-]/g,''))>=0?'green':'red'}">
          <div class="title">${t('reports.profit')}</div><div class="value">${r.profit}</div></div>
        <div class="card blue"><div class="title">${t('reports.operations')}</div><div class="value">${r.salesCount + r.purchasesCount + r.expensesCount}</div></div>
      </div>
      <div class="alert alert-warning">${t('reports.note')}</div>`;
  });
}

function exportReportCSV() {
  const start = document.getElementById('r_start').value;
  const end = document.getElementById('r_end').value;
  google.script.run
    .withSuccessHandler(csv => {
      const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `rapport_${start}_${end}.csv`; a.click();
    })
    .exportCSV({startDate:start, endDate:end});
}

// ===== النسخ الاحتياطي =====
function loadBackup() {
  content.innerHTML = `
    <div class="section-title">${t('backup.title')}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:1000px;">
      <div class="card">
        <div class="title" style="font-size:16px;">${t('backup.exportTitle')}</div>
        <p style="margin:10px 0;color:#776A62;font-size:13px;">${t('backup.exportDesc')}</p>
        <button class="btn btn-success" onclick="doExport()">${t('backup.exportBtn')}</button>
        <div id="exportResult" style="margin-top:15px;"></div>
        <div style="margin-top:15px;">
          <b>📂 ${t('backup.download')}:</b>
          <div id="exportList" style="margin-top:10px;font-size:13px;"></div>
        </div>
      </div>
      <div class="card">
        <div class="title" style="font-size:16px;">${t('backup.importTitle')}</div>
        <p style="margin:10px 0;color:#776A62;font-size:13px;">${t('backup.importWarn')}</p>
        <input type="file" id="importFile" accept=".json" style="margin:10px 0;">
        <br>
        <button class="btn" onclick="doImport()">${t('backup.importBtn')}</button>
        <div id="importResult" style="margin-top:15px;"></div>
      </div>
    </div>
    <div class="card" style="max-width:1000px;margin-top:20px;">
      <div class="title">${t('backup.cardTitle')}</div>
      <p style="margin:10px 0;color:#776A62;">${t('backup.desc')}</p>
      <button class="btn" onclick="doBackup()">${t('backup.btn')}</button>
      <div id="backupResult" style="margin-top:15px;"></div>
    </div>
    <div class="alert alert-warning" style="margin-top:20px;max-width:1000px;">${t('backup.tip')}</div>`;
  loadExportList();
}

function doExport() {
  document.getElementById('exportResult').innerHTML = `<div class="alert">${t('backup.creating')}</div>`;
  call('exportAllData', undefined, msg => {
    document.getElementById('exportResult').innerHTML = `<div class="alert alert-success">${msg.replace(/\n/g,'<br>')}</div>`;
    loadExportList();
  });
}

function loadExportList() {
  call('getExportFile', undefined, files => {
    const list = document.getElementById('exportList');
    if (!files.length) { list.innerHTML = `<div style="color:#776A62;">${t('backup.noBackups')}</div>`; return; }
    list.innerHTML = files.slice(0, 5).map(f => `
      <div style="padding:8px;background:#fff;border-radius:5px;margin:5px 0;display:flex;justify-content:space-between;align-items:center;">
        <span>📄 ${f.name}</span>
        <button class="btn btn-sm" onclick="downloadExport('${f.id}','${f.name}')">${t('backup.download')}</button>
      </div>
    `).join('');
  });
}

function downloadExport(fileId, fileName) {
  call('downloadFile', fileId, data => {
    const blob = new Blob([data.content], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName; a.click();
  });
}

function doImport() {
  const fileInput = document.getElementById('importFile');
  if (!fileInput.files.length) { alert(t('common.chooseFile')); return; }
  if (!confirm(t('common.confirmReplace'))) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('importResult').innerHTML = `<div class="alert">${t('backup.creating')}</div>`;
    call('importAllData', e.target.result, msg => {
      const cls = msg.includes('❌') ? 'alert-danger' : 'alert-success';
      document.getElementById('importResult').innerHTML = `<div class="alert ${cls}">${msg.replace(/\n/g,'<br>')}</div>`;
      if (!msg.includes('❌')) setTimeout(() => loadDashboard(), 2000);
    });
  };
  reader.readAsText(fileInput.files[0]);
}

function doBackup() {
  document.getElementById('backupResult').innerHTML = `<div class="alert">${t('backup.creating')}</div>`;
  call('createBackup', undefined, msg => {
    document.getElementById('backupResult').innerHTML = `<div class="alert alert-success">${msg.replace(/\n/g,'<br>')}</div>`;
  });
}

loadDashboard();
